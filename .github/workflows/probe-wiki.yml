name: Probe Wikipedia maps (temporary)
on:
  push:
    branches: [claude/tender-albattani-9vfp56]
    paths: [".github/probe/**", ".github/workflows/probe-wiki.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python .github/probe/wiki_probe.py
