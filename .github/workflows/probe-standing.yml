name: Probe standing headlines (temporary)
on:
  push:
    branches: [claude/tender-albattani-9vfp56]
    paths: [".github/probe/**", ".github/workflows/probe-standing.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - run: git fetch -q origin data && git show origin/data:state.json > state.json
      - run: python .github/probe/standing_trial.py
        env:
          LLM_API_KEY: ${{ secrets.GEMINI_API_KEY }}
