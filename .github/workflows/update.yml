name: Update conflict data

on:
  schedule:
    # Off the hour and quarter-hours: GitHub delays, and under heavy load drops, scheduled runs at
    # the start of the hour (no scheduled run started for 9 hours on 2026-09-29/30).
    - cron: "4,19,34,49 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["site/**", "pipeline/**", ".github/workflows/**"]

permissions:
  contents: write   # push state to the "data" branch
  pages: write      # publish the site
  id-token: write   # required by deploy-pages
  models: read      # free GitHub Models access for event extraction

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Load the data branch (state and archive)
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The whole branch is restored, including archive/. If the branch exists but cannot be
          # fetched, stop: saving without it would wipe the archive.
          set +e
          git ls-remote --exit-code --heads origin data > /dev/null
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            git clone -q --depth 1 --branch data --single-branch \
              "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" state
          elif [ "$rc" -eq 2 ]; then
            echo "No data branch yet; starting fresh."
            mkdir -p state
          else
            echo "Could not reach the data branch; stopping so nothing is overwritten."
            exit 1
          fi

      - name: Run pipeline
        env:
          LLM_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          NOMINATIM_EMAIL: ${{ vars.NOMINATIM_EMAIL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python pipeline/run.py --state state --out out

      - name: Save state and archive to the data branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # One commit holding every file (state, events, archive/), force-pushed so the branch
          # stays small. Only files that changed are uploaded.
          cd state
          [ -d .git ] || git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan snapshot
          git add -A
          git commit -q -m "State $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" snapshot:data

      - name: Build site
        run: |
          mkdir -p _site/data
          cp -r site/. _site/
          cp out/events.json _site/data/events.json
          cp -r out/reports _site/data/reports
          # each version of the code gets its own address (app.js?v=<commit>), so browsers fetch it
          # afresh after an update instead of running a cached copy against newer data
          sed -i "s/__BUILD__/${GITHUB_SHA:0:12}/g" _site/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
