name: Diagnose model access (temporary)
on:
  push:
    branches: [claude/diag-pipeline]
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r pipeline/requirements.txt
      - name: Try each backup on one real batch (nothing saved)
        env:
          LLM_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          git fetch -q origin data && git show origin/data:state.json > /tmp/state.json
          cd pipeline && python3 - <<'PY'
          import json, os, time
          from datetime import datetime, timezone
          import config as config_mod, extract, providers
          settings = config_mod.load().settings
          state = json.load(open("/tmp/state.json"))
          now = datetime.now(timezone.utc)
          batch = extract.make_batches(state["pending"], settings)[0]
          print("batch posts", len(batch), "openrouter key set", bool(os.environ.get("OPENROUTER_API_KEY")))
          tok = os.environ["LLM_API_KEY"]
          for m in ["gemini-3.5-flash-lite", "gemini-flash-lite-latest", "gemini-3.1-flash-lite", "gemini-2.5-flash-lite", "gemini-3.5-flash", "gemini-flash-latest", "gemini-2.5-flash"]:
              t = time.time()
              try:
                  out = extract._call_model(batch, tok, {"url": settings["llm_url"], "model": m, "json_mode": True}, settings, {})
                  print(f"GEMINI {m}: OK {len(out.get('events', []))} items in {time.time()-t:.0f}s")
              except Exception as e:
                  print(f"GEMINI {m}: {type(e).__name__} {str(e)[:300]}")
          for p in providers.configured(settings).values():
              for m in (p.get("models") or []) + (["qwen-3.8-27b"] if p["name"] == "cerebras" else []):
                  q = dict(p, models=[m])
                  t = time.time()
                  out, used = providers.ask_json(q, extract.SYSTEM_PROMPT, extract._payload(batch), {}, now, max_tokens=int(settings["max_output_tokens"]) + 3000, purpose="extract", temperature=0.1, max_wait=5, effort="low")
                  print(f"{p['name'].upper()} {m}: {'OK ' + str(len(out.get('events', []))) + ' items' if out else 'no answer'} in {time.time()-t:.0f}s")
          PY
