name: Diagnose model access (temporary)
on:
  push:
    branches: [claude/diag-pipeline]
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r pipeline/requirements.txt
      - name: Run extraction once on the live queue (nothing saved)
        env:
          LLM_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
        run: |
          git fetch -q origin data && git show origin/data:state.json > /tmp/state.json
          cd pipeline && python3 - <<'PY'
          import json, os, sys
          from datetime import datetime, timezone
          import config as config_mod, extract, requests
          print("requests UA:", requests.utils.default_user_agent())
          r = requests.get("https://api.cerebras.ai/v1/models", headers={"Authorization": "Bearer " + os.environ["CEREBRAS_API_KEY"]}, timeout=30)
          print("cerebras via requests:", r.status_code, r.text[:200])
          r = requests.get("https://api.cerebras.ai/v1/models", headers={"Authorization": "Bearer " + os.environ["CEREBRAS_API_KEY"], "User-Agent": "situationmonitor/1.0 (+https://github.com/hassmax/situationmonitor)"}, timeout=30)
          print("cerebras with a named UA:", r.status_code, r.text[:200])
          settings = config_mod.load().settings
          state = json.load(open("/tmp/state.json"))
          now = datetime.now(timezone.utc)
          print("calls_remaining", extract.calls_remaining(state, settings, now), "allowed", extract.calls_allowed(state, settings, now, reserve=int(settings.get("extraction_reserve", 30))))
          records, leftover, used, carriers = extract.run(state["pending"][:120], state, settings, now)
          print("RESULT records", len(records), "leftover", len(leftover), "gemini calls", used, "llm_calls", state.get("llm_calls"))
          PY
