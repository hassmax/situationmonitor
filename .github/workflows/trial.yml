name: Trial (temporary)
on:
  push:
    branches: [claude/tender-albattani-9vfp56]
    paths: [".github/probe/**"]
permissions:
  contents: read
jobs:
  trial:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: git clone -q --depth 1 --branch data --single-branch "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" state
      - env:
          LLM_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
        run: python .github/probe/trial.py
