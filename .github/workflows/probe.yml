name: probe (temporary)
on:
  push:
    branches: [claude/tender-albattani-9vfp56]
    paths: [probe.py, .github/workflows/probe.yml]
permissions:
  contents: read
  models: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -q -r pipeline/requirements.txt
      - run: python probe.py
        env:
          GITHUB_MODELS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
