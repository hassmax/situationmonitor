# Temporary: checks from GitHub's servers which mapping sources respond (removed before merging).
name: Probe mapping sources
on:
  push:
    branches: [claude/tender-albattani-9vfp56]
    paths: [".github/workflows/probe.yml", "probe.py"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q -r pipeline/requirements.txt
      - run: python probe.py
