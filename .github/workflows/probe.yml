name: probe
on:
  push:
    branches: [claude/tender-albattani-9vfp56]
    paths: [probe.py, .github/workflows/probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r pipeline/requirements.txt
      - run: git clone -q --depth 1 --branch data --single-branch "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" state
      - name: Full run on a copy of the state (nothing saved or published)
        env:
          LLM_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          NOMINATIM_EMAIL: ${{ vars.NOMINATIM_EMAIL }}
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
        run: python pipeline/run.py --state state --out out 2>&1 | grep -E "\[(frontline|telegram|budget|extract|providers)\]|Traceback|Error" | head -120
      - name: Look at what the agents found
        env:
          LLM_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python probe.py
