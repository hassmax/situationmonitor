name: Gatekeeper trial (temporary)

on:
  push:
    branches: [claude/tender-albattani-9vfp56]
    paths: [".github/trial/**", ".github/workflows/gate-trial.yml"]

permissions:
  contents: read

jobs:
  trial:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r pipeline/requirements.txt -r pipeline/requirements-gate.txt
      - name: Load the data branch (read only)
        run: git clone -q --depth 1 --branch data --single-branch "https://github.com/${GITHUB_REPOSITORY}.git" state
      - name: Trial
        env:
          LLM_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          FASTEMBED_CACHE_PATH: /home/runner/.cache/fastembed
        run: python .github/trial/gate_trial.py
