# Front lines: this site's own assessment of who holds which settlement (pipeline/frontline/),
# built from the reports already on the map, the way ISW assesses control: a side's claim alone is
# shown as a claim; control is "assessed" only on stronger evidence (geolocated footage, a reporter
# on the scene, both sides acknowledging it, an independent analyst, or two independent sources).
#
# Each conflict:
#   id, name        stable id and display name
#   countries       ISO codes of the countries its settlements lie in
#   center, radius_km  a settlement name looked up more than radius_km from center is not used
#                   (many villages share a name: "Pokrovka" exists in a dozen oblasts)
#   actors          the sides, each with:
#     id, name      id used by the agents, and the name shown ("Held by Russia")
#     color         the map colour of ground it holds
#     sources       source `side` codes (sources.yaml) whose reports are aligned with this actor:
#                   their claims count as the actor's own claims
#     aka           other names the reports use, given to the claims agent

conflicts:
  - id: ukraine
    name: Russia–Ukraine
    countries: [UA, RU]
    center: [48.4, 36.5]
    radius_km: 700
    actors:
      - {id: RU, name: Russia, color: "#e39b5b", sources: [RU, BY], aka: "Russian forces, Russian MoD, the 'Sever/Zapad/Tsentr/Yug/Vostok/Dnepr' groupings, Wagner, Akhmat"}
      - {id: UA, name: Ukraine, color: "#5aa9e6", sources: [UA], aka: "Ukrainian forces, the General Staff of Ukraine, Ukrainian brigades, DeepState"}

