# Front lines: this site's own assessment of who holds which settlement (pipeline/frontline/),
# built from the reports already on the map, the way ISW assesses control: a side's claim alone is
# shown as a claim; control is "assessed" only on stronger evidence (geolocated footage, a reporter
# on the scene, both sides acknowledging it, an independent analyst, or two independent sources).
#
# Each conflict:
#   id, name        stable id and display name
#   countries       ISO codes of the countries its settlements lie in
#   center, radius_km  a settlement name looked up more than radius_km from center is not used
#                   (many villages share a name: "Pokrovka" exists in a dozen oblasts)
#   area_km         how far around a settlement its holder's shading reaches (half the usual
#                   distance between the settlements reports name there); where two sides' zones
#                   meet, the line runs halfway between their settlements
#   fill: regions   shade whole provinces: a province holding an assessed `standing` town is shaded
#                   whole, split halfway between the two sides' settlements in it
#                   (pipeline/frontline/regions.json, Natural Earth admin-1, public domain)
#   fill_km         how far from its towns a province is filled (a province never hangs on one
#                   far-off town)
#   reach_km        how far a `standing` town's shading reaches once its control is assessed
#                   (about half the distance between the listed towns, so held ground fills in)
#   standing        towns and cities to check for standing control (standing.py), by region: WHERE
#                   to look, never who holds them; that comes only from what outlets write.
#                   "Kupiansk/Kupyansk": other spellings matched too. `city_only`: the town shares
#                   its region's name, so only "<town> city" / "city of <town>" counts. `whole`: a
#                   description of the region itself ("Russian-occupied Crimea") counts for every
#                   town listed in it (only where a side holds all of it); `aka`: its other names.
#                   `front: true` on a group: towns on a front line or a river, which never fill a
#                   whole province (fill: regions). `provinces` on a town: neighbouring provinces
#                   (regions.json names) with no listed town of their own that it fills too.
#   actors          the sides, each with:
#     id, name      id used by the agents, and the name used in the reviewer's notes
#     controlled    what hovering over ground it holds says ("Russian-controlled")
#     color         the map colour of ground it holds
#     sources       source `side` codes (sources.yaml) whose reports are aligned with this actor:
#                   their claims count as the actor's own claims
#     aka           other names the reports use, given to the claims agent
#     held_as       words outlets put before "-occupied/-held/-controlled/-run <town>" or
#                   "stronghold of <town>" for this side (standing.py)
#     plain_occupied  a bare "occupied <town>" means this side holds it
#     home          countries where this side holding ground is the normal state (not shaded)

conflicts:
  - id: ukraine
    name: Russia–Ukraine
    countries: [UA, RU]
    center: [48.4, 36.5]
    radius_km: 700
    area_km: 10
    reach_km: 35
    actors:
      - {id: RU, name: Russia, controlled: Russian-controlled, color: "#e39b5b", sources: [RU, BY], aka: "Russian forces, Russian MoD, the 'Sever/Zapad/Tsentr/Yug/Vostok/Dnepr' groupings, Wagner, Akhmat",
         held_as: [Russian, Russia, Russian-backed, Moscow, Kremlin], plain_occupied: true, home: [RU]}
      - {id: UA, name: Ukraine, controlled: Ukrainian-controlled, color: "#5aa9e6", sources: [UA], aka: "Ukrainian forces, the General Staff of Ukraine, Ukrainian brigades, DeepState",
         held_as: [Ukrainian, Ukraine, Kyiv], home: []}
    standing:
      # reach_km 10 on a group: towns on the front or on a river (the Dnipro), whose shading must
      # not reach the other side's ground; the rest are behind the lines and reach reach_km
      - region: Crimea
        whole: true
        aka: [Crimean Peninsula]
        reach_km: 45          # all of it is held; wider so the towns fill the peninsula
        places: [Sevastopol, Simferopol, {name: Kerch, reach_km: 20}, Yevpatoria/Yevpatoriia/Eupatoria, Feodosia/Feodosiia, Dzhankoi/Dzhankoy, Yalta,
                 Armiansk/Armyansk, Krasnoperekopsk, Chornomorske/Chernomorskoye, Saky/Saki, Bilohirsk/Belogorsk, Sudak, Alushta, Lenine/Leninsk,
                 Nyzhnohirskyi/Nizhnegorsky, Rozdolne/Razdolnoye, Pervomaiske/Pervomayskoye, Kirovske/Kirovskoye]
      - region: Donetsk Oblast
        places: [Donetsk, Makiivka/Makeevka, Horlivka/Gorlovka, Yenakiieve/Yenakiyevo, Mariupol, Volnovakha, Debaltseve, Khartsyzk, Shakhtarsk,
                 Chystiakove/Torez, Snizhne/Snezhnoye, Amvrosiivka, Ilovaisk, Novoazovsk, Starobesheve, Dokuchaievsk, Mangush/Manhush, Bakhmut,
