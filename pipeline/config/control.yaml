# Territorial control drawn on the map (pipeline/control.py).
#
# Only shapes a named source publishes, fetched as they are (simplified for the map), with the
# source's own date. Nothing here is drawn or estimated by us or by the model.
# Sources: ISW and its Critical Threats Project (the owner's choice, 2026-10-03). Labels follow the
# terms the international community uses (UN General Assembly resolutions speak of the "temporarily
# occupied territories of Ukraine").
#
# Each layer:
#   id            stable id
#   kind          arcgis (default: the source's own shapes) or isw_map (traced from a picture, below)
#   label         what the map calls it
#   style         occupied (filled), advance (this period's gains, amber), infiltration (hatched:
#                 the source says forces are present, not in control)
#   url           an ArcGIS FeatureServer layer (".../FeatureServer/<n>"), or the service
#                 (".../FeatureServer"), in which case its first polygon layer is used
#   source, link  credited and linked in the map
#   max_age_days  not drawn once the source's last edit is older than this (left out, not shown
#                 as current); omit for layers that don't change (areas held before 2022)
#
# Checked 2026-10-03, and not usable yet: Critical Threats' Somalia (al-Shabaab zones, last edited
# June 2025), Syria (ISW, February 2026) and West Africa (November 2025) layers are out of date;
# its eastern DR Congo (September 2026) and Sahel (May 2026) maps are published only as images.
# Neither organisation publishes control data for Yemen, Sudan, Libya, Ethiopia or Myanmar.
#
# Traced layers (kind: isw_map). ISW publishes Yemen's control only as a picture; the owner asked
# for its shapes anyway (2026-10-03), so the newest matching map in the Map Room is traced by colour
# (pipeline/mapshapes.py) and published as approximate, linked to the map it came from:
#   search, title  Map Room search words, and a pattern the map's title must match
#   trace.class    which fill to trace (mapshapes.CLASSES)
#   trace.points   control points: [pixel x, pixel y (1638-wide rendition), lon, lat], one per town
#                  dot ISW prints; fitted once, then each map is shifted by what 3+ of its dots agree
#   trace.bbox     [west, south, east, north]: traced pieces outside it are dropped (logo, legend)
#   trace.inside / outside  places the source certainly shows in / out of the traced area; a map
#                  where that fails (a different layout) is not used and the last copy stays
# LiveUAmap (asked for other countries) refuses GitHub's servers outright (HTTP 403 on every page,
# robots.txt included, 2026-10-03), and sells its data; it is not used.

# Removed 2026-10-03 at the owner's request: ISW's geodata licence ("You may not use this geodata
# without the written consent of ISW") and its Fair Use and Attribution Policy (no incorporating
# its materials into other mapping platforms, no copying its datasets, no modifying them, without
# written permission) don't allow these layers, the shapes traced from its Yemen map included.
# The site's own front-line areas (pipeline/frontline/) replace them. The entries are kept below,
# under a key the pipeline does not read, in case ISW gives written permission: move them back
# under `layers` then.
layers: []

