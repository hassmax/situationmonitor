# Theaters the dashboard tracks.
#
#   id        short id used everywhere (keep it stable once you have data)
#   name      label shown on the dashboard
#   camera    where "fly to" points the globe (altitude: 0.5 = close, 2.5 = whole hemisphere)
#   iso2      countries whose events belong to this theater (ISO 3166-1 alpha-2, used for posts/news)
#   fips      the same countries as FIPS 10-4 codes (GDELT uses these)
#   bbox      optional [south, west, north, east] boxes; an event must also fall inside one of them
#   sea       [south, west, north, east] boxes for water areas with no country
#   highlight countries tinted brighter on the globe (ISO alpha-2)
#
# The extraction prompt in pipeline/extract.py describes these theaters in words.
# If you add or rename one, update that prompt too.

theaters:
  - id: ukraine
    name: Russia–Ukraine
    camera: {lat: 48.5, lng: 34.0, altitude: 0.85}
    iso2: [UA, RU, BY, MD]
    fips: [UP, RS, BO, MD]
    bbox:
      - [43.0, 21.0, 58.5, 50.0]
    sea:
      - [40.8, 27.5, 47.2, 41.8]   # Black Sea and Sea of Azov
    highlight: [UA]

  - id: nato_east
    name: NATO flank and hybrid
    camera: {lat: 56.0, lng: 22.0, altitude: 1.1}
    # Russia and Belarus versus NATO/EU outside Ukraine: the Baltic states, Finland, Poland,
    # Romania, the Baltic Sea, plus Russian-linked sabotage and hybrid attacks across Europe.
    iso2: [EE, LV, LT, FI, PL, RO, NO, SE, DK, DE, NL, BE, FR, GB, CZ, SK, BG, IE, AT, IT, ES]
    fips: [EN, LG, LH, FI, PL, RO, NO, SW, DA, GM, NL, BE, FR, UK, EZ, LO, BU, EI, AU, IT, SP]
    sea:
      - [53.5, 9.5, 66.0, 30.5]    # Baltic Sea
      - [51.0, -4.0, 61.0, 9.5]    # North Sea
    # GDELT only: keep events in this theater only when a Russian actor is involved,
    # so ordinary crime in Western Europe doesn't flood the heat layer.
    gdelt_require: {countries: [RUS]}
    highlight: [EE, LV, LT, FI, PL]

  - id: mideast
    name: Middle East
    camera: {lat: 28.5, lng: 45.0, altitude: 1.25}
    iso2: [IL, PS, LB, SY, IQ, IR, YE, SA, JO, KW, BH, QA, AE, OM]
    fips: [IS, WE, GZ, LE, SY, IZ, IR, YM, SA, JO, KU, BA, QA, AE, MU]
    sea:
      - [12.0, 32.0, 30.0, 44.0]   # Red Sea
      - [10.5, 43.0, 16.5, 52.5]   # Gulf of Aden
      - [23.0, 47.5, 30.5, 57.5]   # Persian Gulf and Strait of Hormuz
      - [19.0, 56.5, 26.5, 63.0]   # Gulf of Oman
      - [31.0, 32.0, 36.5, 36.0]   # Eastern Mediterranean coast
    highlight: [IL, PS, LB, SY, IQ, IR, YE]

  - id: horn
    name: Sudan and Horn of Africa
    camera: {lat: 11.0, lng: 36.0, altitude: 1.2}
    iso2: [SD, SS, ET, ER, SO, DJ]
    fips: [SU, OD, ET, ER, SO, DJ]
    highlight: [SD, SS, ET, ER, SO]

  - id: drc_sahel
    name: Eastern DRC and Sahel
    camera: {lat: 8.0, lng: 10.0, altitude: 1.6}
    iso2: [CD, RW, BI, UG, ML, BF, NE, NG, TD, MR]
    fips: [CG, RW, BY, UG, ML, UV, NG, NI, CD, MR]
    bbox:
      - [9.0, -17.5, 25.0, 24.5]   # Sahel belt
      - [-12.0, 25.0, 4.5, 35.0]   # Eastern DRC and the Great Lakes
    highlight: [CD, RW, BI, ML, BF, NE, TD]

  - id: indopac
    name: Indo-Pacific
    camera: {lat: 22.0, lng: 118.0, altitude: 1.5}
    iso2: [CN, TW, JP, KP, KR, PH, VN, MM, TH, KH, IN, PK]
    fips: [CH, TW, JA, KN, KS, RP, VM, BM, TH, CB, IN, PK]
    sea:
      - [0.0, 105.0, 23.0, 121.5]  # South China Sea
      - [22.0, 117.0, 33.5, 131.0] # Taiwan Strait and East China Sea
      - [33.0, 127.5, 46.0, 142.0] # Sea of Japan
      - [8.0, 121.5, 27.0, 145.0]  # Philippine Sea
    gdelt_posture: true   # also count shows of force, alerts, mobilisation (exercises, buildups)
    highlight: [TW, PH, KP, KR, MM]
    # How far from the camera point a looked-up strike or incident may be (geo.THEATER_KM is
    # 5,000 km): this theater runs from Karachi and the Arabian Sea (5,200-5,500 km) to Japan.
    reach_km: 6500

  - id: latam
    name: Latin America
    camera: {lat: 14.0, lng: -76.0, altitude: 1.4}
    # US operations in the Caribbean and eastern Pacific (boat strikes, Venezuela, Cuba),
    # plus armed-group conflict in Colombia, Ecuador, Mexico, and Haiti.
    iso2: [CU, VE, CO, EC, MX, HT, DO, NI, PA, HN, GT, SV, GY, TT, JM, PR]
    fips: [CU, VE, CO, EC, MX, HA, DR, NU, PM, HO, GT, ES, GY, TD, JM, RQ]
    sea:
      - [9.0, -89.0, 23.5, -59.0]    # Caribbean Sea
      - [-5.0, -100.0, 17.0, -77.0]  # eastern Pacific off Central America, Colombia, Ecuador
    # GDELT only: skip ordinary crime; keep events with a military, rebel, or insurgent
    # actor, or with the US involved.
    gdelt_require: {types: [MIL, REB, INS], countries: [USA]}
    gdelt_posture: true
    highlight: [CU, VE, CO, EC, HT]

  - id: global
    name: Worldwide
    camera: {lat: 30.0, lng: 10.0, altitude: 2.6}
    # Not a conflict area: a country leaving, suspending or joining a treaty, alliance or
    # international body, expelling diplomats or cutting relations, or a new sanctions package,
    # when it concerns none of the conflicts above (the US leaving the Council of Europe's GRECO).
    # Such steps that bear on a conflict go to that conflict's theater. The model assigns this
    # theater; no country maps to it, and GDELT never uses it. Not listed as a section on the
    # page (listed: false): these are diplomacy events, shown and hidden with "Diplomacy, legal".
    listed: false
    iso2: []
    fips: []
    highlight: []
