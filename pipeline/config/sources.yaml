# Where the pipeline looks for new events. Edit freely; the dashboard's "Sources"
# panel shows which ones are reporting and which are failing after each run.
#
# Fields
#   name       label shown on the dashboard
#   kind       osint     independent open-source analysts
#              news      news outlets
#              official  a government, military, or armed group
#              partisan  openly aligned with one side
#   side       set this for any source aligned with a party to the conflict (UA, RU, IL, IR, ...).
#              Reports from sources on the same side never corroborate each other.
#   group      sources sharing a group count as one when checking corroboration
#              (e.g. an outlet's feed and its journalists' accounts)
#   weight     1-3. Higher = processed first when the queue is long, and preferred for the headline summary.
#   prefilter  false = send every post to the model. Use it for channels that only post about the war.
#              true (default) = only posts matching conflict keywords are sent.
#   disabled   true = skip this source without deleting it

settings:
  # Free Gemini API through its OpenAI-compatible endpoint. Candidate models are tried
  # in order and the first that answers is used. Any OpenAI-compatible provider works:
  # change llm_url and llm_models, and put that provider's key in the GEMINI_API_KEY secret.
  llm_url: https://generativelanguage.googleapis.com/v1beta/openai/chat/completions
  llm_models: [gemini-3.5-flash-lite, gemini-flash-lite-latest, gemini-3.1-flash-lite, gemini-3.1-flash-lite-preview, gemini-2.5-flash-lite]
  # Backups, tried only when every model above is overloaded or gone (regular Flash: also free, with
  # a separate, smaller daily limit). The preferred models are tried again after an hour.
  llm_fallback_models: [gemini-3.5-flash, gemini-flash-latest, gemini-3.1-flash, gemini-2.5-flash]
  # Google's free Flash-Lite limit is about 500 a day (AI Studio shows the current one); 470 leaves
  # a margin. Going over it only makes Google refuse calls (HTTP 429): the run stops and retries later.
  daily_llm_calls: 470
  max_calls_per_run: 6
  # Every model call counts against daily_llm_calls. Extraction stops when fewer than
  # extraction_reserve calls are left for the day; the regional analysis (one call, at most
  # hourly) is skipped when fewer than brief_min_calls are left, and the same-story check
  # (one call, at most hourly) when fewer than dedupe_min_calls are left.
  extraction_reserve: 30
  brief_min_calls: 5
  dedupe_min_calls: 10
  # Jobs sent to the free outside providers first (providers.py), with each job's daily token share
  # there; Gemini answers when the provider has no key, fails, or the share is used. Leave a job out
  # to keep it on Gemini; `provider_routes: {}` turns offloading off. "extract" is overflow only:
  # batches Gemini can't take (down, busy, refused for billing, out of calls), at most
  # overflow_batches_per_run a run. Cerebras allows 1,000,000 tokens a day (capped at 900,000).
  # The run log's "[budget]" lines give each job's tokens per day, to tune these.
  provider_routes:
    analysis: {cerebras: 400000}
    recency: {cerebras: 60000}
    frontline_review: {cerebras: 100000}
    frontline_isw: {cerebras: 120000}
    frontline: {cerebras: 100000}
    extract: {cerebras: 120000}
  # GDELT (a free database that logs news reports of violence worldwide every 15 minutes) is used
  # only to corroborate: when 3+ outlets report violence near a single-source post, that post is
  # upgraded to corroborated. Set to false to turn it off.
  gdelt: true

