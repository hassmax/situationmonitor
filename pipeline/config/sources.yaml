# Patrol: Bluesky's keyword search, for posts by accounts not listed above (sources/bluesky.py,
# `search`). Only authors with at least min_followers are kept, and every post goes through the
# keyword filter; accounts found this way share one source group and never corroborate each other.
# Aimed at force movements: bombers, tankers and fighters moving between bases, which OSINT
# accounts post hours before the news.
# Queries name aircraft with their type ("B-52 bombers", not "B-52", which finds the band; not
# "bombers", which finds Catalan firefighters and football clubs), in English posts only (lang).
bluesky_search:
  min_followers: 2000
  lang: en
  queries: [B-1B bombers, B-1 bombers, B-52 bombers, B-2 bombers, stealth bombers, Lancer bombers, bombers RAF, bombers air base,
            F-35s deploy, fighter jets deploy, KC-135 tankers, RAF Fairford, RAF Lakenheath, RAF Mildenhall, Diego Garcia,
            Al Udeid, Prince Sultan Air Base, Incirlik, Akrotiri, carrier strike group, warships deploy]

telegram:
  # Needs the TG_API_ID, TG_API_HASH and TG_SESSION secrets (see README).
  # This starter list is Ukraine-heavy on purpose: Middle East and Africa Telegram
  # channels are mostly run by the parties themselves. Add them deliberately,
  # with kind: official or partisan and the right side.
  - username: DeepStateUA
    name: DeepState (Ukrainian mapping project)
    kind: osint
    side: UA
    group: deepstate
    weight: 3
    prefilter: false
  - username: kpszsu
    name: Ukrainian Air Force (official)
    kind: official
    side: UA
    group: ua-military
    prefilter: false
  - username: mod_russia
    name: Russian Ministry of Defence (official)
    kind: official
    side: RU
    group: ru-military
    prefilter: false
  - username: rybar
    name: Rybar (pro-Kremlin military blog)
    kind: partisan
    side: RU
    group: ru-milbloggers
    prefilter: false
  - username: shin_persian
    # Shin (شین): Iran-focused OSINT in Persian and English (flight tracking, HF radio, imagery),
    # run by the former "Aleph" account. Not marked as aligned with a party; if you judge it
    # partisan, add a side (for example side: IL or side: IR) so it can't corroborate sources
    # on that side. Every post goes to the model because the keyword filter is English-heavy.
    name: Shin (Persian-language OSINT)
    kind: osint
    group: shin
    weight: 2
    prefilter: false
  - username: warmonitors
    # War Monitors: English-language aggregator of breaking conflict news, heavy on the Middle
    # East. It reposts others quickly and sometimes runs unverified claims, so it counts as one
    # unaligned OSINT source like any other: it can't make an event corroborated on its own, and
    # it pairs with Shin for the "two OSINT Telegram channels" alert. English posts, so the
    # keyword filter can screen out the non-conflict ones before they reach the model.
    name: War Monitors (OSINT aggregator)
    kind: osint
    group: warmonitors
  - username: Alomhoar
    # Al-Mehwar News (المحور نيوز): Arabic channel aligned with the Houthis and the "Axis of
    # Resistance", often first with footage of Houthi strikes (the Aden operations room strike,
    # 2026-10-02). Its reports alone show as one side's claim. Posts in Arabic go through the
    # keyword filter (Arabic words included) so the channel's general news doesn't use the budget.
    name: Al-Mehwar News (Houthi-aligned)
    kind: partisan
    side: YE
    group: almehwar
    weight: 2
    prefilter: true
  # OSINT aggregators that post force movements, aircraft and breaking news first, mostly from X
  # (the owner, 2026-10-04: OSINTtechnical's "At least 10 of the B-1s have departed RAF Fairford" was
  # missed; OSINTtechnical's own Telegram stopped in 2022 and its Bluesky in February 2026, and X
  # can't be read for free). All checked live from GitHub's servers that day. OSINTdefender, Clash
  # Report and CIG repost one another and the same X accounts, so together they count as one
  # source (group osint-aggregators): two of them never corroborate each other.
  - username: OSINTdefender
    name: OSINTdefender (OSINT aggregator)
    kind: osint
    group: osint-aggregators
    weight: 2
  - username: ClashReport
    name: Clash Report (OSINT aggregator)
    kind: osint
    group: osint-aggregators
  - username: CIG_telegram
    name: CIG (Counter Intelligence Global, OSINT aggregator)
    kind: osint
    group: osint-aggregators
  - username: Itamilradar
    # Itamilradar: military aircraft tracked over the Mediterranean (transponder data), the same
    # kind of evidence behind posts like the B-1 departures. Unaligned.
    name: Itamilradar (military flight tracking)
    kind: osint
    group: itamilradar
    weight: 2
  - username: manniefabian
    # Mannie's War Room: Emanuel Fabian, The Times of Israel's military correspondent (shares the
    # outlet's group). Often first with IDF statements, which he attributes.
    name: Mannie's War Room (Times of Israel)
    kind: news
    group: timesofisrael
    weight: 2

outlets:
  # Google News results come from many outlets. The outlet that published each result is
  # read from the feed, and outlets listed here count as their own source (so Reuters and
  # Axios reporting the same thing corroborate each other). Outlets not listed are counted
  # together as one "Google News" source, so a story republished by dozens of small sites
  # still counts once.
  #   tier 1   established outlets with strong editorial standards: processed first and
  #            preferred for an event's headline summary
  #   tier 2   known outlets: counted as their own source, normal weight
  #   side     state or partisan media aligned with a party to a conflict. Under the
  #            confidence rules, sources on the same side never corroborate each other.
  #   group    share a group with the outlet's own feed above, or with outlets of the same owner
  #            or newsroom, so they are never counted twice
  #   names    other names Google News shows for the outlet (matched when the link doesn't give
  #            its domain; reports already stored under one of these names are credited to it)
  # Aggregators and sites that mostly republish others (Yahoo, Devdiscourse, Modern Ghana) are
  # deliberately not listed: their copies must not corroborate the original.
  # Wire services and international broadcasters
  - {domain: reuters.com, name: Reuters, tier: 1}
  - {domain: apnews.com, name: AP, tier: 1}
  - {domain: afp.com, name: AFP, tier: 1}
  - {domain: bbc.com, name: BBC, tier: 1, group: bbc}
