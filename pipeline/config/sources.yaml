# Where the pipeline looks for new events. Edit freely; the dashboard's "Sources"
# panel shows which ones are reporting and which are failing after each run.
#
# Fields
#   name       label shown on the dashboard
#   kind       osint     independent open-source analysts
#              news      news outlets
#              official  a government, military, or armed group
#              partisan  openly aligned with one side
#   side       set this for any source aligned with a party to the conflict (UA, RU, IL, IR, ...).
#              Reports from sources on the same side never corroborate each other.
#   group      sources sharing a group count as one when checking corroboration
#              (e.g. an outlet's feed and its journalists' accounts)
#   weight     1-3. Higher = processed first when the queue is long, and preferred for the headline summary.
#   prefilter  false = send every post to the model. Use it for channels that only post about the war.
#              true (default) = only posts matching conflict keywords are sent.
#   disabled   true = skip this source without deleting it

settings:
  # Free Gemini API through its OpenAI-compatible endpoint. Candidate models are tried
  # in order and the first that answers is used. Any OpenAI-compatible provider works:
  # change llm_url and llm_models, and put that provider's key in the GEMINI_API_KEY secret.
  llm_url: https://generativelanguage.googleapis.com/v1beta/openai/chat/completions
  llm_models: [gemini-3.5-flash-lite, gemini-flash-lite-latest, gemini-3.1-flash-lite, gemini-3.1-flash-lite-preview, gemini-2.5-flash-lite]
  daily_llm_calls: 400
  max_calls_per_run: 6

bluesky:
  # Handles below were taken from public profile listings. The Sources panel
  # flags any that stop resolving. Coverage is thinnest for the Middle East,
  # Africa, and the Indo-Pacific; add accounts you trust there.
  - handle: thestudyofwar.bsky.social
    name: Institute for the Study of War
    kind: osint
    group: isw
    weight: 3
  - handle: auroraintel.bsky.social
    name: Aurora Intel
    kind: osint
    group: aurora
    weight: 2
  - handle: blackbirdgroup.bsky.social
